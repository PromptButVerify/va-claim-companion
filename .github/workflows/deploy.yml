name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Create Pages project (idempotent)
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/69eb7327b4089237259225524c28cfe9/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"va-claim-companion","production_branch":"main"}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Project:', d.get('result',{}).get('name','(error)'), d.get('errors',''))"
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 69eb7327b4089237259225524c28cfe9
          projectName: va-claim-companion
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'
